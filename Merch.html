<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Gallery</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1 class="ubuntu-font">My Image Gallery</h1>
    </header>
    <div class="gallery-container">
        <div class="gallery-item">
            <img src="path/to/image1.jpg" alt="Image 1" class="responsive-image" data-magnify-src="path/to/image1.jpg">
            <a href="path/to/image1.jpg" class="ubuntu-font">Image 1</a>
        </div>
        <div class="gallery-item">
            <img src="path/to/image2.jpg" alt="Image 2" class="responsive-image" data-magnify-src="path/to/image2.jpg">
            <a href="path/to/image2.jpg" class="ubuntu-font">Image 2</a>
        </div>
        <div class="gallery-item">
            <img src="path/to/image3.jpg" alt="Image 3" class="responsive-image" data-magnify-src="path/to/image3.jpg">
            <a href="path/to/image3.jpg" class="ubuntu-font">Image 3</a>
        </div>
    </div>

    <!-- Magnific Popup for image magnification -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/magnific-popup/1.1.0/jquery.magnific-popup.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/magnific-popup/1.1.0/magnific-popup.css">
    <script>
        $(document).ready(function() {
            $('.responsive-image').magnificPopup({
                type: 'image',
                mainClass: 'mfp-with-zoom',
                zoom: {
                    enabled: true,
                    duration: 300
                }
            });
        });
    </script>
</body>
</html>
